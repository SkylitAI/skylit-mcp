  /v1/flow/stream:
    get:
      summary: Live cross-ticker options flow (Server-Sent Events)
      operationId: streamFlow
      x-credits: 1
      x-credits-per-minute: 1
      tags: [Flow]
      description: |
        A long-lived `text/event-stream` carrying options trades as they
        print, across every ticker unless you filter. This is the same feed
        that drives the Skylit website, with the same filter semantics.

        ### Live only

        The stream carries trades that arrive **after** you connect; it
        replays no history. Load a backlog from `/v1/flow/{ticker}` first if
        you need one, then attach here. `limit` is rejected with `400` rather
        than silently ignored.

        ### Pricing

        Costs differ from one-shot routes because they accrue over time:

        - **1 credit on connect**, charged before the stream opens — an
          under-funded client gets a clean `402`, not a stream that dies
          immediately.
        - **1 credit per minute open**, reported back as a `credits` event.
        - **5 concurrent streams per account**; a sixth gets `429`.
        - **1 hour maximum**, then a `reconnect` event and a clean close.

        ### Filter names

        This endpoint uses the live-feed filter vocabulary, which differs
        from the curated parameters on `/v1/flow/{ticker}`: use
        `show_calls`/`show_puts` rather than `option_type`, and
        `min_size`/`max_size` rather than `min_contracts`/`max_contracts`.

        ### Events

        | Event | Payload | Meaning |
        |---|---|---|
        | `connected` | stream terms | First frame after the stream opens. |
        | `trade` | trade object | A trade that passed your filters. Flags `sweep_trade`, `multi_leg` and `cross_trade` are always present. |
        | `credits` | `{"remaining": N}` | Emitted each minute after billing. |
        | `lagged` | `{"dropped": N}` | You read slower than the tape; trades were skipped. |
        | `closed` | `{"reason": "..."}` | Terminal. `insufficient_credits`, `account_suspended`, `credit_check_failed`, or `feed_unavailable`. |
        | `reconnect` | `{"reason": "max_duration"}` | Terminal after 1h; reconnect to continue. |

        A `:` comment arrives every 30s as a proxy keepalive. Treat a stalled
        stream as a reconnect signal.

        ### Example

        ```
        curl -N -H "Authorization: Bearer $SKYLIT_API_KEY" \
          "https://flow-api.skylit.ai/v1/flow/stream?min_premium=100000&show_puts=false"
        ```

        `-N` matters: without it curl buffers the response and the stream
        appears to hang.
      parameters:
        - name: ticker
          in: query
          required: false
          description: |
            Comma-separated tickers to include (e.g. `AAPL,NVDA`, max 50).
            Omit to stream every ticker.
          schema: { type: string }
        - name: exclude_ticker
          in: query
          required: false
          description: Comma-separated tickers to exclude.
          schema: { type: string }
        - name: min_premium
          in: query
          required: false
          description: |
            Minimum premium per trade (USD). Strongly recommended — an
            unfiltered stream carries the entire tape.
          schema: { type: number, format: double, example: 100000 }
        - name: max_premium
          in: query
          required: false
          description: Maximum premium per trade (USD).
          schema: { type: number, format: double }
        - name: min_size
          in: query
          required: false
          description: Minimum contracts per trade.
          schema: { type: integer, minimum: 0 }
        - name: max_size
          in: query
          required: false
          description: Maximum contracts per trade.
          schema: { type: integer, minimum: 0 }
        - name: show_calls
          in: query
          required: false
          description: Include calls.
          schema: { type: boolean, default: true }
        - name: show_puts
          in: query
          required: false
          description: Include puts.
          schema: { type: boolean, default: true }
        - name: show_below_bid
          in: query
          required: false
          description: |
            Include prints below the bid. The five side toggles are
            independent buckets: `show_bid` covers exact-bid prints,
            `show_ask` exact-ask, and the aggressive variants are gated by
            their own toggles.
          schema: { type: boolean, default: true }
        - name: show_bid
          in: query
          required: false
          description: Include prints at the bid.
          schema: { type: boolean, default: true }
        - name: show_mid
          in: query
          required: false
          description: Include prints at the mid.
          schema: { type: boolean, default: true }
        - name: show_ask
          in: query
          required: false
          description: Include prints at the ask.
          schema: { type: boolean, default: true }
        - name: show_above_ask
          in: query
          required: false
          description: Include prints above the ask.
          schema: { type: boolean, default: true }
        - name: min_dte
          in: query
          required: false
          description: Minimum days to expiration.
          schema: { type: integer }
        - name: max_dte
          in: query
          required: false
          description: Maximum days to expiration.
          schema: { type: integer }
        - name: only_0dte
          in: query
          required: false
          description: Restrict to contracts expiring today.
          schema: { type: boolean, default: false }
        - name: min_oi
          in: query
          required: false
          description: Minimum open interest on the contract.
          schema: { type: integer, minimum: 0 }
        - name: max_oi
          in: query
          required: false
          description: Maximum open interest on the contract.
          schema: { type: integer, minimum: 0 }
        - name: min_vol_oi
          in: query
          required: false
          description: Minimum volume/open-interest ratio.
          schema: { type: number, format: double }
        - name: max_vol_oi
          in: query
          required: false
          description: Maximum volume/open-interest ratio.
          schema: { type: number, format: double }
        - name: min_iv
          in: query
          required: false
          description: Minimum implied volatility (decimal, e.g. `0.42`).
          schema: { type: number, format: double }
        - name: max_iv
          in: query
          required: false
          description: Maximum implied volatility (decimal).
          schema: { type: number, format: double }
        - name: only_sweeps
          in: query
          required: false
          description: Restrict to multi-exchange sweeps.
          schema: { type: boolean, default: false }
        - name: only_crosses
          in: query
          required: false
          description: |
            Restrict to pre-negotiated crosses. These carry no aggressor
            information, so `side` is not meaningful on them.
          schema: { type: boolean, default: false }
        - name: only_multi_leg
          in: query
          required: false
          description: Restrict to legs of multi-leg strategies.
          schema: { type: boolean, default: false }
        - name: exclude_multi_leg
          in: query
          required: false
          description: Exclude multi-leg legs, leaving outright trades.
          schema: { type: boolean, default: false }
        - name: min_flow_score
          in: query
          required: false
          description: Minimum directional Flow Score (-100 → +100).
          schema: { type: integer, minimum: -100, maximum: 100 }
        - name: max_flow_score
          in: query
          required: false
          description: Maximum directional Flow Score.
          schema: { type: integer, minimum: -100, maximum: 100 }
        - name: abs_min_flow_score
          in: query
          required: false
          description: |
            Minimum absolute Flow Score — conviction in either direction.
          schema: { type: integer, minimum: 0, maximum: 100 }
        - name: min_percentile
          in: query
          required: false
          description: |
            Minimum premium percentile for the ticker. Trades with no
            computed percentile are excluded once this is set.
          schema: { type: integer, enum: [0, 50, 75, 90, 95, 99] }
        - name: show_stocks
          in: query
          required: false
          description: Include single-stock underlyings.
          schema: { type: boolean, default: true }
        - name: show_etf
          in: query
          required: false
          description: Include ETF underlyings.
          schema: { type: boolean, default: true }
        - name: show_indices
          in: query
          required: false
          description: Include index underlyings.
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: |
            An open SSE stream. Frames are newline-delimited
            `event:`/`data:` pairs as described above.
          content:
            text/event-stream:
              schema: { type: string }
        "400":
          description: |
            An unsupported parameter was supplied — `limit` is not valid on
            the stream.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "402": { $ref: "#/components/responses/InsufficientCredits" }
        "429":
          description: |
            Either the account's request rate limit, or its cap of 5
            concurrent streams (`stream_limit_reached`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "404": { $ref: "#/components/responses/NotFound" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

  /v1/sweeps/{ticker}:
