openapi: 3.1.0
info:
  title: Flowseeker — Skylit Public API
  version: "1.0.0"
  summary: Real-time and historical options-flow analytics as a public HTTP API.
  description: |
    Flowseeker exposes Skylit's real-time options-flow scoring stack — Flow
    Score, FlowBonus, VWF/SDF/FIR aggregates, sector rotation, and market
    breadth — as a versioned public HTTP API. Data is sourced from the full
    OPRA options feed with sub-second freshness during market hours.

    **Base URL.** `https://api.skylit.ai` serves this API and the core
    (Heatseeker) API with one key. `https://flow-api.skylit.ai` is a
    permanent alias for the same API: same keys, limits and credits. This
    spec is also served at `https://api.skylit.ai/v1/flow/openapi.json`.

    **Authentication.** Send your Skylit API key as a bearer token:

        Authorization: Bearer <key>

    The gateway also accepts the bare key in the `Authorization` header
    without the `Bearer ` prefix. `X-API-Key` and query-string keys are not
    accepted (`401`). A request without an `Authorization` header gets `401`;
    an unknown, revoked or expired key gets `403`.

    **Rate limits.** Each key has a requests-per-minute limit set by the
    account's plan (Pro, Protégé and Quant: 120 per key; invite: 60 per key),
    counted across every Skylit API host. `GET https://api.skylit.ai/v1/account`
    returns it as `limits.requestsPerMinute`; read it instead of hard-coding a
    number. Over it the gateway answers `429` `rate_limited`. Responses carry
    `X-RateLimit-Limit` (the key's limit), `X-RateLimit-Remaining` (requests
    left in the current window) and `X-RateLimit-Reset` (Unix time, in
    seconds, when the window resets). The gateway's `429` has no `Retry-After`: wait until
    `X-RateLimit-Reset`. `429`s from the API itself (concurrency and stream
    limits) carry `Retry-After`.

    **Query budget.** Requests that must run a fresh query (anything not
    answered from a cached or precomputed result) share a per-account budget
    across all servers: a cap on queries running at once and on fresh queries
    per second. Over it the API answers at once with `429`
    `TOO_MANY_CONCURRENT_QUERIES` or `RATE_LIMITED` and `Retry-After: 1`; the
    request is not queued and not charged. Cached answers never count. To read
    a whole day, follow `meta.nextCursor` (see `/v1/flow/{ticker}`) instead of
    splitting the time window: one request per page, no overlap.

    **Credits & billing.** Every `/v1/*` data request debits a fixed number of
    **credits** from your account's shared Skylit balance (the same balance used
    across all Skylit public APIs). Each chargeable response carries
    `X-Credits-Remaining: <balance>`. Credits are charged before the request
    is served and refunded when it fails (any `4xx` or `5xx`, or a `200`
    with an empty body). Cost is priced
    by server-side work and data volume returned:

    | Tier | Credits | Routes |
    |------|--------:|--------|
    | Light | 1 | single-key reads, ratios, scores, discovery/search lists, expirations, rvol, per-contract bull/bear, the flow feed |
    | Medium | 3 | charts, full chains, by-strike matrix, momentum/baseline/strikes, tide, aggregate, sweeps, market, sector, market-breadth, chain bull/bear, unusual-volume/oi screeners, dark-pool top-prints |
    | Heavy | 5 | trade feeds (`/trades`, dark-pool trades), history (`/history`, `historical-compare`), bulk endpoints |

    **Range-priced routes.** Where the range you ask for drives the work, the
    tier price covers the first 30 days and each further 30 days (or part) is
    charged again, so `interval=360D` on `/v1/market/tide` costs 3 × 12 = 36
    credits. Range caps are enforced up front with a `400` (never charged):

    | Route | Cap | Price |
    |-------|-----|-------|
    | `/v1/market/tide` | `interval` ≤ 30D with an intraday `bucket` (`1min`–`30min`), ≤ 360D with `1d`/`1w`; ≤ 5D with `exclude_deep_itm=true` | 3 × ⌈days ÷ 30⌉; with `exclude_deep_itm=true`, 3 per trading day |
    | `/v1/underlying/{ticker}/chart`, `/v1/contract/{symbol}/chart` | `interval` ≤ 30D with an intraday `bucket`, ≤ 365D with `1d`/`1w` | 3 × ⌈days ÷ 30⌉ |
    | `/v1/aggregate/{ticker}` | at most 8 `timeframes` | 3 × ⌈summed window days ÷ 30⌉ (`all` = 130 days = 15 credits) |
    | `/v1/contract/top/daily` | — | 1 with `ticker`, 3 without (market-wide scan) |

    `/v1/openapi.json` is free. When you run out of credits the API returns
    `402` `insufficient_credits`; a suspended account returns `403`
    `account_suspended`; a transient billing-store error returns `503`
    `credit_check_failed` (safe to retry). These billing codes are lowercase
    (`insufficient_credits`, `account_suspended`, `credit_check_failed`) — the
    platform-wide convention for credit errors.

    **Response envelope.** All success responses share one shape:

        { "data": <payload>, "meta": { "timestamp": "...", "requestId": "..." } }

    All errors share one shape:

        { "error": { "code": "NOT_FOUND", "message": "...",
                     "docs_url": "https://www.skylit.ai/docs/api-reference/errors#not_found" } }

    `docs_url` (a link to the error's entry on the errors page) is optional:
    read it when present, never require it. Retrying: `429` and `5xx` are
    safe to retry with backoff (honor `Retry-After` when sent, otherwise wait
    until `X-RateLimit-Reset` for a gateway `429`); other `4xx` need a changed
    request. See https://www.skylit.ai/docs/api-reference/rate-limits-and-retries.

    Field names are camelCase throughout. Codes are stable, machine-readable
    `SCREAMING_SNAKE_CASE` strings — the message text may evolve.

    **Validation.** Requests are checked against this document before they
    are charged:

    - A parameter with a documented set of values (for example `timeframe`,
      `order_by`, `right`, `format`) must use one of them; anything else
      returns `400` `INVALID_PARAMETER` naming the allowed values. Date
      parameters must be `YYYY-MM-DD`.
    - A ticker Skylit has never seen returns `404` `SYMBOL_NOT_FOUND`, whether
      it is in the path, the root of a contract symbol, or a `ticker` filter.
      For a list parameter (`tickers`, `symbols`) the request is served when
      at least one entry is known; unknown entries are simply absent from the
      result, and `404` is returned only when none is known. A known ticker
      with no activity in the window still returns `200` with empty data.
      Search (`/v1/underlying/search`) is not a lookup and returns `200 []`.
    - List parameters accept at most 50 symbols; more returns `400`.
    - Stay inside documented numeric ranges (`minimum`/`maximum`). Values
      outside a range are not rejected on every route today; where accepted
      they may be clamped (for example `limit` above its maximum) or ignored,
      so don't rely on out-of-range behaviour.
    - A request that has not completed after 25 seconds returns `504`
      `GATEWAY_TIMEOUT`; narrow the window or retry.

    None of these failures are charged.

    **Freshness.** Endpoints with a `timeframe` parameter (e.g. `/v1/flow/{ticker}`)
    return data through the last completed bucket. Intra-bucket fills land on the
    next request. The cumulative `/v1/flow/market-breadth` and aggregate scoring
    endpoints update at most once per second.

servers:
  - url: https://api.skylit.ai
    description: Production (one base URL for the core and Flowseeker APIs)
  - url: https://flow-api.skylit.ai
    description: Production, legacy alias (same API, keys, limits and credits)

security:
  - bearerApiKey: []

tags:
  - name: Flow
    description: Per-ticker flow feed, aggregate scoring, baselines, and momentum.
  - name: Sweeps
    description: Aggregated multi-exchange sweeps and sweep-only feeds.
  - name: Sector
    description: Sector- and industry-level flow rollups.
  - name: Market
    description: Market-wide overview, breadth, advance/decline, sector rotation, and net-premium tide.
  - name: Analytics
    description: |
      Standalone analytics endpoints — Vol/OI accumulation, moneyness segmentation,
      and timeframe-aggregated sentiment scores.
  - name: Ratios
    description: |
      Bid/ask/mid distribution analyses at chain and contract granularity, plus
      call/put-aware bull/bear pressure breakdowns.
  - name: Scoring
    description: Per-trade scoring, sentiment, and intent classification.
  - name: Underlying
    description: |
      Ticker-level discovery and analytics — top tickers by flow,
      bulk stats, intraday chart bars, raw enriched trades, strike /
      expiration distributions, option chain, and historical rollups.
  - name: Contract
    description: |
      Per-contract discovery and analytics — top contracts by flow,
      unusual volume / OI scans, contract stats, intraday chart bars,
      raw enriched trades, and historical rollups.
  - name: Dark Pool
    description: |
      Off-exchange (TRF) prints — paginated dark-pool trades and the
      largest individual prints per ticker. No side / BBO / greeks.
  - name: Meta
    description: API metadata (this OpenAPI document, etc.).

paths:
  /v1/flow/{ticker}:
    get:
      summary: Raw flow feed for a ticker (Flow Score + FlowBonus per trade)
      operationId: getFlow
      x-credits: 1
      tags: [Flow]
      description: |
        Returns the most recent options trades for `{ticker}` within the
        requested timeframe, each scored on Skylit's directional Flow Score
        (-100 → +100) and conviction-weighted FlowBonus. The response also
        includes timeframe-level VWF / SDF / FIR aggregates.

        **Paging.** Trades come newest first. When a page is full (`limit`
        rows read), `meta.nextCursor` is set: pass it back as `cursor` with the
        same filters to get the next, older page. It resumes exactly after the
        last row, so no trade is skipped or repeated, even when several share
        one nanosecond timestamp. No `nextCursor` means you have reached the
        start of the window; a `cursor` page with no trades returns `200` with
        an empty `trades` array. `min_flow_score`, `min_flow_bonus` and
        `min_rvol` filter after the read, so a page can hold fewer than
        `limit` trades while `nextCursor` is still set: keep following it.
        `meta.nextEndTime` is the last row's exact time (nanoseconds) for
        clients that page with `end_time`; it is inclusive, so trades at that
        instant can repeat. Prefer `cursor`.

        **Backfilling a day** for one contract, 500 trades per request:

            GET /v1/flow/SPY?date=2026-09-30&expiration=2026-09-30&min_strike=660&max_strike=660&option_type=call&limit=500
            → meta.nextCursor = "dDEuMTc5..."
            GET /v1/flow/SPY?date=2026-09-30&expiration=2026-09-30&min_strike=660&max_strike=660&option_type=call&limit=500&cursor=dDEuMTc5...
            → repeat until meta.nextCursor is absent

        Each page costs one request. Splitting the window around the 500-row
        limit instead (bisecting) re-reads overlapping ranges, spends the
        account's query budget several times over, and gets an
        `X-Skylit-Hint` response header pointing here.
      parameters:
        - $ref: "#/components/parameters/Ticker"
        - $ref: "#/components/parameters/Timeframe"
        - name: limit
          in: query
          required: false
          description: Max trades returned. Server caps this at 500.
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
        - name: cursor
          in: query
          required: false
          description: |
            `meta.nextCursor` from the previous page, passed back unchanged with
            the same filters. Opaque; an invalid value returns `400`.
          schema: { type: string }
        - name: min_premium
          in: query
          required: false
          description: Minimum total premium per trade (USD).
          schema: { type: number, format: double, example: 50000 }
        - name: option_type
          in: query
          required: false
          description: Filter to calls or puts. `all` returns both.
          schema: { type: string, enum: [call, put, all], default: all }
        - name: trade_type
          in: query
          required: false
          description: |
            Filter by trade type. Comma-separated for multiple; every token
            must be one of the listed values.
          schema: { type: string, enum: [sweep, multi_leg, all], default: all }
        - name: moneyness
          in: query
          required: false
          description: |
            Moneyness category filter. Comma-separated for multiple
            (e.g. `otm,deep_otm`). Every token must be one of the listed
            values; an unknown token returns `400`.
          schema:
            type: string
            enum: [deep_itm, itm, atm, otm, deep_otm, all]
            default: all
        - name: start_time
          in: query
          required: false
          description: |
            Optional lower bound for the trade window. Accepts RFC 3339
            (`2026-05-27T13:30:00Z`) or Unix seconds. Omit to use the timeframe.
          schema: { type: string }
        - name: end_time
          in: query
          required: false
          description: Optional upper bound (RFC 3339 or Unix seconds).
          schema: { type: string }
        - name: max_premium
          in: query
          required: false
          description: Maximum total premium per trade (USD).
          schema: { type: number, format: double }
        - name: min_contracts
          in: query
          required: false
          description: Minimum contract size per trade.
          schema: { type: integer, minimum: 0 }
        - name: max_contracts
          in: query
          required: false
          description: Maximum contract size per trade.
          schema: { type: integer, minimum: 0 }
        - name: single_leg_only
          in: query
          required: false
          description: If `true`, exclude trades flagged as part of a multi-leg structure.
          schema: { type: boolean, default: false }
        - name: min_dte
          in: query
          required: false
          description: Minimum days to expiration.
          schema: { type: integer }
        - name: max_dte
          in: query
          required: false
          description: Maximum days to expiration.
          schema: { type: integer }
        - name: min_strike
          in: query
          required: false
          description: Minimum strike price (inclusive).
          schema: { type: number, format: double }
        - name: max_strike
          in: query
          required: false
          description: Maximum strike price (inclusive).
          schema: { type: number, format: double }
        - name: expiration
          in: query
          required: false
          description: Filter to a single expiration date (YYYY-MM-DD).
          schema: { type: string, format: date }
        - name: conviction_weights
          in: query
          required: false
          description: |
            Optional JSON object overriding the Flow Score conviction weights.
            Weights must be non-negative and sum to within 0.95–1.05, else 400.
          schema: { type: string }
        - name: min_flow_score
          in: query
          required: false
          description: Filter to trades with `flowScore` ≥ this value (-100..100).
          schema: { type: integer, minimum: -100, maximum: 100 }
        - name: min_flow_bonus
          in: query
          required: false
          description: Filter to trades with `flowBonus` ≥ this value.
          schema: { type: integer, minimum: 0 }
        - name: min_rvol
          in: query
          required: false
          description: Filter to trades with relative volume ≥ this multiple.
          schema: { type: number, format: double, minimum: 0, example: 2.0 }
        - name: include_clusters
          in: query
          required: false
          description: |
            If `true`, attach `cluster*` fields when a trade is part of a
            multi-leg cluster (sweep, condor, etc.).
          schema: { type: boolean, default: true }
        - name: date
          in: query
          required: false
          description: Trading date (YYYY-MM-DD). Defaults to current trading date.
          schema: { type: string, format: date, example: "2026-05-27" }
      responses:
        "200":
          description: Flow feed for `{ticker}`.
          headers:
            X-RateLimit-Limit: { schema: { type: integer } }
            X-RateLimit-Remaining: { schema: { type: integer } }
            X-RateLimit-Reset: { schema: { type: integer } }
            X-Credits-Remaining:
              description: Credit balance remaining after this request was charged.
              schema: { type: integer }
            X-Skylit-Hint:
              description: |
                Informational, sometimes present: `use next_cursor (<docs link>)`
                when this account sent several overlapping time windows for the
                same filters within seconds. The response itself is unaffected.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "402": { $ref: "#/components/responses/InsufficientCredits" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

  /v1/flow/{ticker}/aggregate:
    get:
      summary: Aggregate flow over an arbitrary [start, end] window
      operationId: getFlowAggregate
      x-credits: 3
      tags: [Flow]
      description: |
        Server-side aggregation across an arbitrary `[startTime, endTime]`
        window — no row cap. Returns trade/sweep counts, VWF/SDF/FIR, and a
        bullish/bearish/neutral premium split with a one-line interpretation.
        Useful for arbitrary slicing without paging the full trade list.
      parameters:
        - $ref: "#/components/parameters/Ticker"
        - $ref: "#/components/parameters/StartTime"
        - $ref: "#/components/parameters/EndTime"
        - name: option_type
          in: query
          required: false
          schema: { type: string, enum: [call, put, all], default: all }
        - name: min_premium
          in: query
          required: false
          schema: { type: number, format: double }
        - name: exclude_multi_leg
          in: query
          required: false
          description: Exclude trades flagged as part of a multi-leg structure.
          schema: { type: boolean, default: false }
        - name: min_dte
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
        - name: max_dte
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Window-aggregated flow scores.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowAggregateSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "402": { $ref: "#/components/responses/InsufficientCredits" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

  /v1/flow/{ticker}/tide:
    get:
      summary: Per-ticker net-premium time series ("flow tide")
      operationId: getFlowTide
      x-credits: 3
      tags: [Flow]
      description: |
        Bucketed bullish vs bearish premium time series for a single ticker,
        with cumulative net premium and per-bucket VWF/SDF/FIR. The
        ticker-level analogue of `/v1/market/tide`.
      parameters:
        - $ref: "#/components/parameters/Ticker"
        - $ref: "#/components/parameters/StartTime"
        - $ref: "#/components/parameters/EndTime"
        - $ref: "#/components/parameters/Bucket"
        - name: option_type
          in: query
          required: false
          schema: { type: string, enum: [call, put, all], default: all }
        - name: min_premium
          in: query
          required: false
          schema: { type: number, format: double }
        - name: exclude_multi_leg
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: min_dte
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
        - name: max_dte
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Per-bucket flow tide bars.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowTideSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "402": { $ref: "#/components/responses/InsufficientCredits" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "404": { $ref: "#/components/responses/NotFound" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

  /v1/flow/{ticker}/baseline:
    get:
      summary: Trailing per-time-of-day flow baseline (avg + stddev)
      operationId: getFlowBaseline
      x-credits: 3
      tags: [Flow]
      description: |
        Time-of-day baseline buckets for `{ticker}` — average and standard
        deviation of trade count, premium, and FIR per intraday bucket over a
        configurable lookback window. The reference distribution behind
        `/v1/flow/{ticker}/momentum` z-scores.
      parameters:
        - $ref: "#/components/parameters/Ticker"
        - $ref: "#/components/parameters/Bucket"
        - name: lookback_days
          in: query
          required: false
          description: Trailing window size in trading days.
          schema: { type: integer, default: 20, minimum: 1, maximum: 30 }
        - name: start_time_of_day
          in: query
          required: false
          description: Lower bound of intraday window (HH:MM ET).
          schema: { type: string, default: "09:30", example: "09:30" }
        - name: end_time_of_day
          in: query
          required: false
          description: Upper bound of intraday window (HH:MM ET).
          schema: { type: string, default: "16:00", example: "16:00" }
        - name: min_dte
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
        - name: max_dte
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Per-bucket baseline statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaselineSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "402": { $ref: "#/components/responses/InsufficientCredits" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "404": { $ref: "#/components/responses/NotFound" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

  /v1/flow/{ticker}/momentum:
    get:
      summary: Live momentum signal vs baseline (5m / 30m / 1h windows)
      operationId: getFlowMomentum
      x-credits: 3
      tags: [Flow]
      description: |
        Compares the current 5-minute, 30-minute, and 1-hour flow against the
        trailing per-time-of-day baseline (`/v1/flow/{ticker}/baseline`).
        Returns z-scores for the 5-minute window and a one-token `trend`
        classification.
      parameters:
        - $ref: "#/components/parameters/Ticker"
        - name: as_of
          in: query
          required: false
          description: Replay anchor. Accepts RFC 3339 or Unix seconds. Defaults to "now".
          schema: { type: string }
        - name: lookback_days
          in: query
          required: false
          description: Trailing window size in trading days.
          schema: { type: integer, default: 20, minimum: 1, maximum: 30 }
        - name: min_dte
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
        - name: max_dte
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Live momentum metrics + signal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MomentumSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "402": { $ref: "#/components/responses/InsufficientCredits" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "404": { $ref: "#/components/responses/NotFound" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

  /v1/flow/{ticker}/strikes:
    get:
      summary: Strike-level flow concentration
      operationId: getFlowStrikes
      x-credits: 3
      tags: [Flow]
      description: |
        Where the directional money is going for `{ticker}`. Top-N strikes
        by selected ordering (premium, net premium, volume, etc.) with
        bullish/bearish premium split, ask/bid mix, and OI context. Includes
        a top-3 concentration summary.
      parameters:
        - $ref: "#/components/parameters/Ticker"
        - $ref: "#/components/parameters/StartTime"
