name: TypeScript package

on:
  push:
    branches: [main]
    paths: ["packages/typescript/**", ".github/workflows/typescript.yml"]
    tags: ["ts-v*"]
  pull_request:
    paths: ["packages/typescript/**", ".github/workflows/typescript.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  publish:
    # Tag ts-vX.Y.Z (matching package.json) to release. npm Trusted Publishing
    # (OIDC): no token is stored anywhere. Needs the trusted publisher set on
    # npmjs.com for this repo + workflow after the first release.
    if: startsWith(github.ref, 'refs/tags/ts-v')
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - name: Tag matches version
        run: test "ts-v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm publish --provenance --access public
