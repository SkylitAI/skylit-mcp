        "503": { $ref: "#/components/responses/Unavailable" }
        "404": { $ref: "#/components/responses/NotFound" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

  /v1/contract/{symbol}/trades:
    get:
      summary: Raw enriched trades for a contract
      operationId: getContractTrades
      x-credits: 5
      tags: [Contract]
      description: |
        Same enriched trade shape as `/v1/underlying/{ticker}/trades`,
        scoped to a single OPRA contract. Because the contract is fixed,
        chain-level filters (moneyness, strike, DTE, expiration) do not
        apply here.

        **Paging.** Trades come largest premium first. When a page is full,
        `meta.nextCursor` is set: pass it back as `cursor` with the same
        `start`, `end` and filters for the next page. No gaps or repeats; no
        `nextCursor` means the window is exhausted. Splitting the time window
        instead re-reads overlapping ranges and gets an `X-Skylit-Hint`
        response header.
      parameters:
        - $ref: "#/components/parameters/OptionSymbol"
        - in: query
          name: cursor
          description: |
            `meta.nextCursor` from the previous page, passed back unchanged with
            the same filters. Opaque; an invalid value returns `400`.
          schema: { type: string }
        - in: query
          name: start
          description: Lower time bound — RFC 3339 or Unix seconds. Defaults to start-of-trading-day.
          schema: { type: string }
        - in: query
          name: end
          description: Upper time bound — RFC 3339 or Unix seconds. Defaults to now.
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - in: query
          name: only_sweeps
          schema: { type: boolean }
        - in: query
          name: only_multi_leg
          schema: { type: boolean }
        - in: query
          name: exclude_multi_leg
          schema: { type: boolean }
        - in: query
          name: min_premium
          schema: { type: number, format: double, minimum: 0 }
      responses:
        "200":
          description: Enriched trades for the contract.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionTradeListSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/InsufficientCredits" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "404": { $ref: "#/components/responses/NotFound" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

