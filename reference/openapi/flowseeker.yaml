    # ── Dark Pool (off-exchange / TRF prints) ────────────────────────────
    DarkPoolPrint:
      type: object
      description: |
        One off-exchange (TRF) print. Carries no side / BBO / greeks.
      required: [timestamp, ticker, price, size, notional, venue, sector, industry]
      properties:
        timestamp:
          type: string
          format: date-time
          description: Trade time, ISO-8601 UTC (millisecond precision).
          example: "2026-07-02T14:31:05.123Z"
        ticker:
          type: string
          description: Underlying (dotted equity symbol, e.g. `BRK.B`).
          example: SPY
        price: { type: number, format: double }
        size: { type: integer, minimum: 0, description: Shares. }
        notional:
          type: number
          format: double
          description: "`price × size` (USD)."
        venue:
          type: string
          enum: [FINN, FINC]
          description: FINRA TRF reporting venue.
        sector: { type: string, description: GICS sector of the underlying. }
        industry: { type: string, description: GICS industry of the underlying. }
        pctAvgVol:
          type: [number, "null"]
          format: double
          description: |
            Print size as a percent of the underlying's average daily volume
            (`size ÷ ADV × 100`, e.g. `15.53` = 15.53% of a normal day's
            consolidated volume). ADV is a consolidated average daily volume,
            refreshed daily. Omitted when no ADV is available for the ticker
            (recent IPO, alternate-class symbol, or ADV not yet loaded).
          example: 15.53

    DarkPoolTradesMeta:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [limit, offset, count, hasMore]
          properties:
            limit:
              type: integer
              description: Page size applied (after clamping to 1..=5000).
            offset:
              type: integer
              description: Row offset applied.
            count:
              type: integer
              description: Number of prints returned in this page.
            hasMore:
              type: boolean
              description: |
                `true` when the page is full (`count == limit`), so more rows
                may exist. Offset-based heuristic, not an exact total.
            nextCursor:
              type: [string, "null"]
              description: |
                Pass as `cursor`, with the same filters, for the next page
                (`sort=time`). `null` when a newest-first sequence is
                exhausted; `order=asc` always returns one, for polling.

    DarkPoolTradesSuccess:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/DarkPoolPrint" }
        meta: { $ref: "#/components/schemas/DarkPoolTradesMeta" }

    DarkPoolTopPrint:
      type: object
      description: One of the largest individual dark-pool prints over the window.
      required: [timestamp, price, notional, size]
      properties:
        timestamp:
          type: string
          format: date-time
          description: Trade time, ISO-8601 UTC.
        price: { type: number, format: double }
        notional:
          type: number
          format: double
          description: "`price × size` (USD)."
        size: { type: integer, minimum: 0, description: Shares. }

    DarkPoolTopPrintsSuccess:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/DarkPoolTopPrint" }
        meta: { $ref: "#/components/schemas/Meta" }

    DarkPoolLevel:
      type: object
      description: Dark-pool volume in one price bucket over the window.
      required: [price, prints, shares, notional, pctOfNotional, blockPrints, blockNotional]
      properties:
        price: { type: number, format: double, description: Lower edge of the bucket (USD). }
        prints: { type: integer, minimum: 0 }
        shares: { type: integer, minimum: 0 }
        notional: { type: number, format: double, description: Notional printed in the bucket (USD). }
        pctOfNotional:
          type: number
          format: double
          description: Percent of the window's total dark-pool notional.
        blockPrints: { type: integer, minimum: 0, description: Prints of at least $1M. }
        blockNotional: { type: number, format: double, description: Notional of those prints (USD). }

    DarkPoolLevelsMeta:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [ticker, dateStart, dateEnd, bucket, totalShares, totalNotional]
          properties:
            ticker: { type: string }
            dateStart: { type: string, format: date }
            dateEnd: { type: string, format: date }
            bucket: { type: number, format: double, description: Bucket width applied (USD). }
            totalShares: { type: integer, minimum: 0, description: Window total across every level. }
            totalNotional: { type: number, format: double, description: Window total across every level (USD). }

    DarkPoolLevelsSuccess:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/DarkPoolLevel" }
        meta: { $ref: "#/components/schemas/DarkPoolLevelsMeta" }

    DarkPoolDailyRow:
      type: object
      description: Dark-pool totals for one ticker, on one day or over the range.
      required:
        [date, ticker, sector, industry, prints, shares, notional, vwap, blockPrints, blockNotional, largestPrint, days]
      properties:
        date:
          type: [string, "null"]
          format: date
          description: Trade date; `null` with `group_by=ticker`.
        ticker: { type: string }
        sector: { type: string }
        industry: { type: string }
        prints: { type: integer, minimum: 0 }
        shares: { type: integer, minimum: 0 }
        notional: { type: number, format: double, description: USD. }
        vwap: { type: number, format: double, description: Notional-weighted average print price. }
        blockPrints: { type: integer, minimum: 0, description: Prints of at least $1M. }
        blockNotional: { type: number, format: double, description: Notional of those prints (USD). }
        largestPrint: { type: number, format: double, description: Largest single print (USD). }
        days: { type: integer, minimum: 0, description: Days with prints in the row. }
        pctAvgVol:
          type: [number, "null"]
          format: double
          description: |
            Average daily dark-pool shares as a percent of the ticker's average
            daily volume. `null` when no ADV is available.

    DarkPoolDailyMeta:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [dateStart, dateEnd, groupBy, limit, offset, count, hasMore]
          properties:
            dateStart: { type: string, format: date }
            dateEnd: { type: string, format: date }
            groupBy: { type: string, enum: [day, ticker] }
            limit: { type: integer }
            offset: { type: integer }
            count: { type: integer }
            hasMore: { type: boolean, description: "`true` when the page is full (`count == limit`)." }

    DarkPoolDailySuccess:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/DarkPoolDailyRow" }
        meta: { $ref: "#/components/schemas/DarkPoolDailyMeta" }

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            invalidParam:
              value:
                error:
                  code: INVALID_PARAMETER
                  message: "Invalid value 'bogus' for 'timeframe'. Allowed: 5m, 15m, 1h, 4h, 1d."
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            missingKey:
              value:
                error:
                  code: UNAUTHORIZED
                  message: Authentication required
    Forbidden:
      description: >-
        Unknown, revoked or expired API key (the gateway's `forbidden`), the
        account's API access is suspended (`account_suspended`) or blocked
        (`account_blocked`). Not retryable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            badKey:
              value:
                error:
                  code: FORBIDDEN
                  message: Access to this API has been disallowed
            accountSuspended:
              value:
                error:
                  code: account_suspended
                  message: "API access has been suspended for this account. Contact support."
    NotFound:
      description: >-
        Unknown ticker or contract (`SYMBOL_NOT_FOUND`), or no data for the
        requested window. Not charged.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            unknownSymbol:
              value:
                error:
                  code: SYMBOL_NOT_FOUND
                  message: "Unknown ticker 'ZZZZQ'."
            noData:
              value:
                error:
                  code: NOT_FOUND
                  message: "No trades found for AAPL on 2026-05-27 with timeframe 1d"
    GatewayTimeout:
      description: >-
        The request did not complete within 25 seconds. Not charged; narrow
        the window or retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            tooSlow:
              value:
                error:
                  code: GATEWAY_TIMEOUT
                  message: "The request took too long and was not completed. It was not charged; narrow the request or retry."
    RateLimited:
      description: >-
        Either the key exceeded its requests-per-minute limit
        (`X-RateLimit-Limit`; no `Retry-After`, wait until
        `X-RateLimit-Reset`), or the account is over one of the API's own
        limits, such as the query budget (queries running at once, fresh
        queries per second): `TOO_MANY_CONCURRENT_QUERIES` or `RATE_LIMITED`
        with `Retry-After`. Not charged; retry after the wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            tooFast:
              value:
                error:
                  code: RATE_LIMITED
                  message: "Rate limit exceeded."
            queryBudget:
              value:
                error:
                  code: TOO_MANY_CONCURRENT_QUERIES
                  message: "This account already has 16 queries running on the shared query engine across all servers (limit ch.concurrent.customer). Cached answers are not affected. Retry after Retry-After; to backfill a day, follow meta.nextCursor instead of splitting time windows. See https://www.skylit.ai/docs/api-reference/rate-limits-and-retries"
                  retry_after: 1
                  docs_url: "https://www.skylit.ai/docs/api-reference/errors#too_many_concurrent_queries"
    InternalError:
      description: >-
        Unexpected server error (`INTERNAL_ERROR`, `DATABASE_ERROR`). Not
        charged; safe to retry with exponential backoff.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            internal:
              value:
                error:
                  code: INTERNAL_ERROR
                  message: Internal server error
    Unavailable:
      description: >-
        Underlying data source temporarily unavailable, the credit balance
        could not be verified (`credit_check_failed`), or the API is paused
        for maintenance (`api_paused`, with a `Retry-After` header and a
        `retry_after` field in seconds). Not charged; safe to retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            ingestionLag:
              value:
                error:
                  code: UNAVAILABLE
                  message: "Live feed is degraded; please retry in a few seconds."
            creditCheckFailed:
              value:
                error:
                  code: credit_check_failed
                  message: "Could not verify credit balance. Please retry."
    InsufficientCredits:
      description: >-
        The account's shared Skylit credit balance is lower than this route's
        cost. Top up to continue. Carries `X-Credits-Remaining: 0`.
      headers:
        X-Credits-Remaining:
          description: Remaining credit balance (0 on this response).
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            outOfCredits:
              value:
                error:
                  code: insufficient_credits
                  message: "Out of credits. Top up to continue making requests."

