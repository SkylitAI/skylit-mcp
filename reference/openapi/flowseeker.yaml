  /v1/underlying/{ticker}/chart:
    get:
      summary: Intraday chart bars for a ticker
      operationId: getUnderlyingChart
      x-credits: 3
      tags: [Underlying]
      description: |
        Returns time-bucketed bars aggregating options activity for the
        underlying (call/put volume + premium, P/C ratio, bid/ask
        execution split) plus the underlying stock price at each
        boundary. Backed by the same intraday rollup tables that power
        the chart modal in the Skylit UI.
      parameters:
        - $ref: "#/components/parameters/Ticker"
        - in: query
          name: interval
          required: true
          description: |
            Trailing window covered by the bars (e.g. `1D`, `7D`, `30D`).
            At most `30D` with an intraday bucket, `365D` with `1d`/`1w`.
            Priced by range: 3 credits per started 30 days.
            N counts **trading days** (weekends and market holidays are
            skipped), ending with the current or latest session.
          schema: { type: string, example: "1D" }
        - in: query
          name: bucket
          required: true
          description: |
            Bucket size. Every bucket in the window is returned, zero-filled
            when nothing traded, so the response grows with window / bucket:
            `1min` over `30D` is about 11,700 bars (390 per session), a
            multi-megabyte response. For windows over about 20 trading days,
            use `5min` or coarser.
            Retention: `1min`-`30min` cover the last 365 days; `1d` and `1w`
            go back to 2023-03-27.
          schema:
            type: string
            enum: [1min, 5min, 10min, 15min, 30min, 1d, 1w]
      responses:
        "200":
          description: Intraday chart bars.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnderlyingChartSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/InsufficientCredits" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
