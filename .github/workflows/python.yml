name: Python package

on:
  push:
    branches: [main]
    paths: ["packages/python/**", ".github/workflows/python.yml"]
    tags: ["python-v*"]
  pull_request:
    paths: ["packages/python/**", ".github/workflows/python.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: pytest -q tests

  publish:
    # Tag python-vX.Y.Z (matching pyproject's version) to release.
    # PyPI Trusted Publishing: no token is stored anywhere.
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches version
        run: test "python-v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "${GITHUB_REF_NAME}"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
