  /v1/contract/{symbol}/chart:
    get:
      summary: Intraday chart bars for a contract
      operationId: getContractChart
      x-credits: 3
      tags: [Contract]
      description: |
        Time-bucketed bars for a single contract — granular bid/mid/ask
        execution split, premium and volume per side, daily cumulative
        totals, VWAP, and (when available) IV and 30D average baselines.
      parameters:
        - $ref: "#/components/parameters/OptionSymbol"
        - in: query
          name: interval
          required: true
          description: |
            Trailing window — `{N}D` where N is 1–365 (e.g. `1D`, `7D`).
            At most `30D` with an intraday bucket. Priced by range: 3 credits
            per started 30 days.
            N counts **trading days** (weekends and market holidays are
            skipped), ending with the current or latest session.
          schema: { type: string, example: "1D" }
        - in: query
          name: bucket
          required: true
          description: |
            Bucket size. Every bucket in the window is returned, zero-filled
            when nothing traded, so the response grows with window / bucket:
            `1min` over `30D` is about 11,700 bars (390 per session), a
            multi-megabyte response. For windows over about 20 trading days,
            use `5min` or coarser.
            Retention: `1min`-`30min` cover the last 365 days; `1d` and `1w`
            go back to 2023-03-27.
          schema:
            type: string
            enum: [1min, 5min, 10min, 15min, 30min, 1d, 1w]
      responses:
        "200":
          description: Intraday bars for the contract.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractChartSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
